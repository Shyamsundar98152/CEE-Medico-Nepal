<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOC Nepal — Drug of Choice</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f5f6f2;--card:#fff;--tx:#16262b;--mu:#5d6d72;--ln:#dde2dc;--br:#0f6b6b;--brd:#0a4f4f;--soft:#e3f0ee;--rd:#a8142f;--rds:#fbeaed;--am:#9a5b00;--ams:#fdf1dc;--hl:#fff1a8}
html.dark{--bg:#0f1b1e;--card:#172629;--tx:#e6eeee;--mu:#98aaad;--ln:#2a3d41;--br:#3fb5ad;--brd:#7fd3cc;--soft:#1b3438;--rd:#ff8fa3;--rds:#3a1c24;--am:#f0b45a;--ams:#33270f;--hl:#665a10}
html{font-size:16px}html.fs-l{font-size:18px}html.fs-s{font-size:14.5px}
body{background:var(--bg);color:var(--tx);font-family:'Source Sans 3',system-ui,sans-serif}
.serif{font-family:'Source Serif 4',Georgia,serif}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px}
.inp{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:.55rem .75rem;font-size:.95rem}
.inp:focus,.btn:focus-visible,.btn2:focus-visible,summary:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.btn{background:var(--br);color:#fff;border-radius:8px;padding:.5rem .9rem;font-weight:600;font-size:.875rem}
html.dark .btn{color:#06201f}
.btn:hover{background:var(--brd)}html.dark .btn:hover{background:var(--brd)}
.btn2{border:1px solid var(--ln);background:var(--card);border-radius:8px;padding:.45rem .8rem;font-weight:600;font-size:.85rem}
.btn2:hover{border-color:var(--br)}.btn2.on{background:var(--soft);border-color:var(--br);color:var(--brd)}
.dng{color:var(--rd)}
mark{background:var(--hl);color:inherit;border-radius:2px}
.mu{color:var(--mu)}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(90deg)}.chev{transition:transform .15s}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:.1rem .5rem;border-radius:99px;background:var(--soft);color:var(--brd)}
.tag.p{background:var(--ams);color:var(--am)}.tag.c{background:var(--rds);color:var(--rd)}
.hide-sb{scrollbar-width:none}.hide-sb::-webkit-scrollbar{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;

/* ============ FIREBASE (your existing project) ============ */
const firebaseConfig={apiKey:"AIzaSyANTEvessOCqYqfzYVX9V11CAN-xjF7ubQ",authDomain:"doc-drug-of-choice.firebaseapp.com",projectId:"doc-drug-of-choice",storageBucket:"doc-drug-of-choice.firebasestorage.app",messagingSenderId:"177639649857",appId:"1:177639649857:web:98d71685c6b31b93084cc0",measurementId:"G-XML2TZYJG7"};
let auth,db;
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();}catch(e){console.error(e)}
// Same UID as in your Firestore rules. This only decides which buttons the UI shows; the rules do the real enforcing.
const ADMIN_UIDS=['XDzOhJQkiRhJ8PNV5V24IopnGyZ2'];

/* ============ SCHEMA: admin forms are generated from this, so every field is editable ============ */
const SCHEMAS={
 drugs:{label:'Drugs',one:'drug',title:'genericName',sub:'drugClass',fields:[
  {k:'genericName',l:'Generic name',req:1},{k:'brandNames',l:'Brand names (comma separated)',t:'list'},{k:'drugClass',l:'Drug class'},
  {k:'indications',l:'Uses / Indications',t:'area'},{k:'mechanismOfAction',l:'Mechanism of action',t:'area'},
  {k:'adultDose',l:'Adult dose',t:'area'},{k:'pediatricDose',l:'Pediatric dose',t:'area'},
  {k:'adverseDrugReactions',l:'Adverse drug reactions (ADR)',t:'area'},{k:'contraindications',l:'Contraindications (C/I)',t:'area'},
  {k:'published',l:'Visible to the public',t:'bool'}]},
 conditions:{label:'Conditions',one:'condition',title:'name',sub:'overview',fields:[
  {k:'name',l:'Condition name',req:1},{k:'overview',l:'Overview',t:'area'},{k:'firstLineTreatment',l:'First-line treatment',t:'area'},
  {k:'alternativeTreatments',l:'Alternative treatments',t:'area'},{k:'referralCriteria',l:'Referral criteria',t:'area'},
  {k:'published',l:'Visible to the public',t:'bool'}]},
 prices:{label:'Prices',one:'price',title:'brandName',sub:'genericName',fields:[
  {k:'brandName',l:'Brand name',req:1},{k:'genericName',l:'Generic name (must match the drug)',req:1},{k:'strength',l:'Strength / form (e.g. 500 mg tablet)'},
  {k:'packSize',l:'Pack size'},{k:'manufacturer',l:'Manufacturer'},{k:'priceNPR',l:'Price (NPR)',t:'num',req:1},
  {k:'verificationStatus',l:'Verification (the public only sees Verified prices)',t:'sel',o:['Verified','Unverified','Outdated']}]},
 references:{label:'References',one:'reference',title:'title',sub:'publisher',fields:[
  {k:'title',l:'Title',req:1},{k:'publisher',l:'Publisher'},{k:'publicationDate',l:'Publication date'},{k:'url',l:'Link (URL)'}]}
};
const DRUG_SECTIONS=[['indications','Uses'],['dose','Dosage'],['adverseDrugReactions','ADR (side effects)'],['contraindications','C/I (contraindications)'],['mechanismOfAction','Mechanism of action'],['prices','Nepal prices']];

/* ============ HELPERS ============ */
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||('item-'+Date.now());
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const npr=n=>typeof n==='number'?'NPR '+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const flat=o=>Object.entries(o).filter(([k])=>!['id','updatedAt','published'].includes(k)).map(([,v])=>Array.isArray(v)?v.join(' '):(v&&typeof v==='object')?'':v).join(' ').toLowerCase();
const parseRoute=()=>{const [,n='home',id='']=location.hash.replace('#','').split('/');return{n,id:decodeURIComponent(id)}};
const go=(n,id)=>{location.hash='/'+n+(id?'/'+encodeURIComponent(id):'')};
function hl(t,toks){
 if(t==null||t==='')return t; if(!toks||!toks.length)return t;
 const re=new RegExp('('+toks.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
 return String(t).split(re).map((p,i)=>i%2?<mark key={i}>{p}</mark>:p);
}
function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();}

/* ============ APP ============ */
function App(){
 const [route,setRoute]=useState(parseRoute());
 const [data,setData]=useState({drugs:[],conditions:[],prices:[],references:[]});
 const [loaded,setLoaded]=useState({});
 const [err,setErr]=useState('');
 const [user,setUser]=useState(null);
 const [adm,setAdm]=useState(false); // false = not admin, null = checking, true = admin
 const [q,setQ]=useState('');
 const [prefs,setPrefs]=useState(()=>({theme:'light',size:'m',compact:false,sections:{indications:1,dose:1,adverseDrugReactions:1,contraindications:1,mechanismOfAction:1,prices:1},...lsGet('doc_prefs',{})}));
 const [favs,setFavs]=useState(()=>lsGet('doc_favs',[]));
 const [recent,setRecent]=useState(()=>lsGet('doc_recent',[]));
 const [cmp,setCmp]=useState([]);
 const [editor,setEditor]=useState(null);
 const [toast,setToast]=useState('');

 useEffect(()=>{const f=()=>{setRoute(parseRoute());window.scrollTo(0,0)};window.addEventListener('hashchange',f);return()=>window.removeEventListener('hashchange',f)},[]);
 useEffect(()=>{if(!auth)return;return auth.onAuthStateChanged(async u=>{
  setUser(u);if(!u){setAdm(false);return}setAdm(null);
  try{const r=await u.getIdTokenResult(true);setAdm(r.claims.admin===true||ADMIN_UIDS.includes(u.uid))}catch(e){setAdm(ADMIN_UIDS.includes(u.uid))}
 })},[]);
 useEffect(()=>{
  if(!db){setErr('Firebase did not start. Check your connection.');return}
  if(adm===null)return; // still checking admin status
  // Your rules only let the public read published drugs/conditions and Verified prices,
  // so the query itself must filter, otherwise Firestore rejects the whole read.
  const qf=c=>{const r=db.collection(c);if(adm===true)return r;
   if(c==='drugs'||c==='conditions')return r.where('published','==',true);
   if(c==='prices')return r.where('verificationStatus','==','Verified');return r};
  const offs=Object.keys(SCHEMAS).map(c=>qf(c).onSnapshot(s=>{
    setData(d=>({...d,[c]:s.docs.map(x=>({id:x.id,...x.data()}))}));setLoaded(l=>({...l,[c]:1}));setErr('');
  },e=>{console.error(e);setErr('Could not read "'+c+'": '+e.message)}));
  return()=>offs.forEach(o=>o());
 },[adm]);
 useEffect(()=>{
  const h=document.documentElement;h.classList.toggle('dark',prefs.theme==='dark');
  h.classList.toggle('fs-l',prefs.size==='l');h.classList.toggle('fs-s',prefs.size==='s');lsSet('doc_prefs',prefs);
 },[prefs]);
 useEffect(()=>lsSet('doc_favs',favs),[favs]);
 useEffect(()=>lsSet('doc_recent',recent),[recent]);
 useEffect(()=>{if(toast){const t=setTimeout(()=>setToast(''),2500);return()=>clearTimeout(t)}},[toast]);

 const isAdmin=adm===true;
 const vis=useMemo(()=>{const o={};for(const c in data)o[c]=data[c].filter(x=>isAdmin||x.published!==false);return o},[data,isAdmin]);
 const pricesByGeneric=useMemo(()=>{const m={};vis.prices.forEach(p=>{const k=(p.genericName||'').toLowerCase().trim();(m[k]=m[k]||[]).push(p)});return m},[vis.prices]);

 // One search index over everything: drugs (incl. their brands and prices), conditions, prices, references
 const index=useMemo(()=>{
  const L=[];
  vis.drugs.forEach(d=>{const ps=pricesByGeneric[(d.genericName||'').toLowerCase().trim()]||[];
   L.push({type:'drugs',id:d.id,item:d,name:(d.genericName+' '+(d.brandNames||[]).join(' ')).toLowerCase(),text:flat(d)+' '+ps.map(p=>flat(p)).join(' ')})});
  vis.conditions.forEach(c=>L.push({type:'conditions',id:c.id,item:c,name:(c.name||'').toLowerCase(),text:flat(c)}));
  vis.prices.forEach(p=>L.push({type:'prices',id:p.id,item:p,name:((p.brandName||'')+' '+(p.genericName||'')).toLowerCase(),text:flat(p)}));
  vis.references.forEach(r=>L.push({type:'references',id:r.id,item:r,name:(r.title||'').toLowerCase(),text:flat(r)}));
  return L;
 },[vis,pricesByGeneric]);
 const toks=useMemo(()=>q.toLowerCase().split(/\s+/).filter(Boolean),[q]);
 const results=useMemo(()=>{
  if(!toks.length)return[];
  return index.filter(r=>toks.every(t=>r.text.includes(t)||r.name.includes(t)))
   .map(r=>({...r,score:toks.reduce((s,t)=>s+(r.name.startsWith(t)?4:r.name.includes(t)?2:0),0)}))
   .sort((a,b)=>b.score-a.score);
 },[index,toks]);

 const ctx={route,data,vis,user,isAdmin,q,setQ,prefs,setPrefs,favs,setFavs,recent,setRecent,cmp,setCmp,editor,setEditor,toast:setToast,results,toks,pricesByGeneric,index};
 const ready=loaded.drugs&&loaded.conditions&&loaded.prices&&loaded.references;
 const n=route.n;
 const nav=[['home','Home'],['search','Search'],['prices','Prices'],['favorites','Saved ('+favs.length+')'],['compare','Compare ('+cmp.length+')'],['references','References'],['settings','Settings']];

 return(<div className="min-h-screen flex flex-col">
  <header className="sticky top-0 z-40 border-b" style={{background:'var(--card)',borderColor:'var(--ln)'}}>
   <div className="max-w-6xl mx-auto px-4 h-14 flex items-center gap-4">
    <button onClick={()=>go('home')} className="flex items-baseline gap-2 shrink-0" aria-label="DOC Nepal home">
     <span className="serif text-xl font-bold" style={{color:'var(--br)'}}>DOC Nepal</span><span className="mu text-xs hidden sm:inline">Drug of Choice</span>
    </button>
    <nav className="flex gap-1 overflow-x-auto hide-sb flex-1" aria-label="Main">
     {nav.map(([k,l])=><button key={k} onClick={()=>go(k)} className={'btn2 whitespace-nowrap '+(n===k?'on':'')} style={n===k?{}:{border:'none',background:'transparent'}}>{l}</button>)}
    </nav>
    {user?<div className="flex gap-2 shrink-0">{isAdmin&&<button className="btn" onClick={()=>go('admin')}>Admin</button>}<button className="btn2" onClick={()=>auth.signOut()}>Log out</button></div>
     :<button className="btn2 shrink-0" onClick={()=>go('login')}>Admin login</button>}
   </div>
  </header>
  {err&&<div className="text-sm text-center py-2" style={{background:'var(--rds)',color:'var(--rd)'}}>{err}</div>}
  <main className="flex-1">
   {!ready&&n!=='login'&&n!=='settings'&&!err?<div className="text-center py-20 mu">Loading the drug database…</div>:<>
    {n==='home'&&<Home {...ctx}/>}
    {n==='search'&&<Search {...ctx}/>}
    {n==='drug'&&<DrugPage {...ctx}/>}
    {n==='condition'&&<ConditionPage {...ctx}/>}
    {n==='prices'&&<Prices {...ctx}/>}
    {n==='favorites'&&<Favorites {...ctx}/>}
    {n==='compare'&&<Compare {...ctx}/>}
    {n==='references'&&<References {...ctx}/>}
    {n==='settings'&&<Settings {...ctx}/>}
    {n==='login'&&<Login/>}
    {n==='admin'&&(isAdmin?<Admin {...ctx}/>:user&&adm===null?<div className="text-center py-20 mu">Checking admin access…</div>:<div className="max-w-md mx-auto mt-16 card p-8 text-center"><p className="mb-4">{user?'This account is not an administrator, so it cannot edit records.':'Log in as an administrator to manage records.'}</p>{!user&&<button className="btn" onClick={()=>go('login')}>Go to login</button>}</div>)}
   </>}
  </main>
  <footer className="text-xs text-center py-6 mu border-t" style={{borderColor:'var(--ln)'}}>
   Reference for healthcare professionals. It does not replace clinical judgment. Prices are indicative; check the label and the latest market rate.
  </footer>
  {editor&&<Editor {...ctx}/>}
  {toast&&<div role="status" className="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm font-semibold shadow-lg z-50" style={{background:'var(--tx)',color:'var(--bg)'}}>{toast}</div>}
 </div>);
}

/* ============ SMALL SHARED PIECES ============ */
function SearchBox({q,setQ,big,index,toks}){
 const [open,setOpen]=useState(false);
 const sug=useMemo(()=>{if(!toks.length)return[];return index.filter(r=>toks.every(t=>r.name.includes(t))).slice(0,6)},[index,toks]);
 return(<div className="relative">
  <form onSubmit={e=>{e.preventDefault();setOpen(false);go('search')}}>
   <input className="inp" style={big?{padding:'.9rem 1rem',fontSize:'1.05rem'}:{}} value={q} onChange={e=>{setQ(e.target.value);setOpen(true)}} onFocus={()=>setOpen(true)}
    placeholder="Search drug, brand, use, side effect, C/I, condition, price…" aria-label="Search"/>
  </form>
  {open&&sug.length>0&&<div className="card absolute left-0 right-0 mt-1 z-30 overflow-hidden shadow-lg">
   {sug.map(r=><button key={r.type+r.id} className="w-full text-left px-4 py-2 hover:opacity-80 flex justify-between gap-2 border-b" style={{borderColor:'var(--ln)'}}
    onClick={()=>{setOpen(false);r.type==='drugs'?go('drug',r.id):r.type==='conditions'?go('condition',r.id):go('search')}}>
    <span>{hl(r.item.genericName||r.item.name||r.item.brandName||r.item.title,toks)}</span><span className="tag">{r.type}</span></button>)}
   <button className="w-full text-left px-4 py-2 text-sm mu" onClick={()=>{setOpen(false);go('search')}}>See all results</button>
  </div>}
 </div>);
}
const Empty=({children})=><div className="card p-8 text-center mu text-sm">{children}</div>;
function Star({id,favs,setFavs}){
 const on=favs.includes(id);
 return <button className={'btn2 '+(on?'on':'')} aria-pressed={on} onClick={()=>setFavs(on?favs.filter(x=>x!==id):[...favs,id])}>{on?'★ Saved':'☆ Save'}</button>;
}
function AdminBtns({coll,item,ctx,small}){
 if(!ctx.isAdmin)return null;
 return <span className="inline-flex gap-1"><button className="btn2" style={small?{padding:'.15rem .5rem',fontSize:'.75rem'}:{}} onClick={e=>{e.stopPropagation();ctx.setEditor({coll,item})}}>Edit</button>
  <button className="btn2 dng" style={small?{padding:'.15rem .5rem',fontSize:'.75rem'}:{}} onClick={e=>{e.stopPropagation();delRec(coll,item,ctx)}}>Delete</button></span>;
}
async function delRec(coll,item,ctx){
 if(!confirm('Delete "'+(item[SCHEMAS[coll].title]||item.id)+'"? This cannot be undone.'))return;
 try{await db.collection(coll).doc(item.id).delete();ctx.toast('Deleted');if(ctx.route.n==='drug'||ctx.route.n==='condition')go('home')}catch(e){ctx.toast('Delete failed: '+e.message)}
}
function DrugCard({d,toks,pricesByGeneric,compact,favs}){
 const ps=pricesByGeneric[(d.genericName||'').toLowerCase().trim()]||[];
 const min=ps.length?Math.min(...ps.map(p=>p.priceNPR).filter(x=>typeof x==='number')):null;
 return(<button onClick={()=>go('drug',d.id)} className="card p-4 text-left w-full hover:shadow-md transition" style={{borderLeft:'4px solid var(--br)'}}>
  <div className="flex justify-between gap-2 items-start"><div className="serif text-lg font-bold">{hl(d.genericName,toks)} {favs.includes('drugs:'+d.id)&&<span style={{color:'var(--am)'}}>★</span>}</div>
   {d.published===false&&<span className="tag p">Draft</span>}</div>
  <div className="text-sm" style={{color:'var(--brd)'}}>{hl(d.drugClass,toks)}</div>
  {d.brandNames?.length>0&&<div className="text-xs mu mt-1">Brands: {hl(d.brandNames.join(', '),toks)}</div>}
  {!compact&&d.indications&&<p className="text-sm mt-2 line-clamp-2">{hl(d.indications,toks)}</p>}
  {Number.isFinite(min)&&<div className="text-xs mt-2 font-semibold" style={{color:'var(--am)'}}>From {npr(min)}</div>}
 </button>);
}

/* ============ HOME ============ */
function Home(c){
 const {vis,favs,recent,setQ,prefs}=c;
 const classes=useMemo(()=>{const m={};vis.drugs.forEach(d=>d.drugClass&&(m[d.drugClass]=(m[d.drugClass]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10)},[vis.drugs]);
 const favDrugs=vis.drugs.filter(d=>favs.includes('drugs:'+d.id));
 const pick=t=>{setQ(t);go('search')};
 return(<div className="max-w-6xl mx-auto px-4 py-8 space-y-8">
  <section className="py-6">
   <h1 className="serif text-3xl sm:text-4xl font-bold mb-2">Find the right drug, dose and price.</h1>
   <p className="mu mb-5 max-w-xl">Uses, side effects, contraindications and Nepal prices in one place. Type anything: a drug, a brand, a symptom or a price.</p>
   <SearchBox {...c} big/>
   {recent.length>0&&<div className="flex flex-wrap gap-2 mt-3 items-center"><span className="text-xs mu">Recent:</span>
    {recent.slice(0,6).map(r=><button key={r} className="btn2" style={{padding:'.15rem .6rem',fontSize:'.8rem'}} onClick={()=>pick(r)}>{r}</button>)}
    <button className="text-xs mu underline" onClick={()=>c.setRecent([])}>Clear</button></div>}
  </section>
  {classes.length>0&&<section><h2 className="font-bold mb-2">Browse by drug class</h2>
   <div className="flex flex-wrap gap-2">{classes.map(([k,v])=><button key={k} className="btn2" onClick={()=>pick(k)}>{k} <span className="mu">{v}</span></button>)}</div></section>}
  {favDrugs.length>0&&<section><h2 className="font-bold mb-2">Your saved drugs</h2>
   <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">{favDrugs.map(d=><DrugCard key={d.id} d={d} {...c} toks={[]} compact/>)}</div></section>}
  <section><div className="flex justify-between items-center mb-2"><h2 className="font-bold">All drugs ({vis.drugs.length})</h2>
   {c.isAdmin&&<button className="btn" onClick={()=>c.setEditor({coll:'drugs',item:null})}>+ Add drug</button>}</div>
   {vis.drugs.length===0?<Empty>No drugs yet. {c.isAdmin?'Use “Add drug” above.':'An administrator needs to add records.'}</Empty>:
   <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">{[...vis.drugs].sort((a,b)=>(a.genericName||'').localeCompare(b.genericName||'')).slice(0,12).map(d=><DrugCard key={d.id} d={d} {...c} toks={[]} compact={prefs.compact}/>)}</div>}
   {vis.drugs.length>12&&<button className="btn2 mt-3" onClick={()=>{setQ(' ');go('search')}}>Show all drugs</button>}
  </section>
  {vis.conditions.length>0&&<section><h2 className="font-bold mb-2">Conditions ({vis.conditions.length})</h2>
   <div className="grid sm:grid-cols-2 gap-3">{vis.conditions.slice(0,6).map(x=><button key={x.id} onClick={()=>go('condition',x.id)} className="card p-4 text-left hover:shadow-md">
    <div className="serif font-bold text-lg">{x.name}</div>{x.firstLineTreatment&&<div className="text-sm mt-1" style={{color:'var(--brd)'}}>First-line: {x.firstLineTreatment.slice(0,110)}</div>}</button>)}</div></section>}
 </div>);
}

/* ============ SEARCH ============ */
function Search(c){
 const {results,toks,q,setQ,recent,setRecent,prefs,vis}=c;
 const [type,setType]=useState('all');
 const [sort,setSort]=useState('rel');

/* ============ EDITOR: one form for every record type ============ */
function Editor({editor,setEditor,toast}){
 const sc=SCHEMAS[editor.coll];const it=editor.item;
 const [v,setV]=useState(()=>{const o={};sc.fields.forEach(f=>{const x=it?it[f.k]:(editor.preset?.[f.k]);
  o[f.k]=f.t==='list'?(x||[]).join(', '):f.t==='bool'?(x!==false):(x??(f.t==='sel'?f.o[0]:''))});return o});
 const [busy,setBusy]=useState(false);const [er,setEr]=useState('');
 const save=async ev=>{ev.preventDefault();setBusy(true);setEr('');
  try{
   const out={};
   sc.fields.forEach(f=>{let x=v[f.k];
    if(f.t==='list')x=String(x).split(',').map(s=>s.trim()).filter(Boolean);
    if(f.t==='num')x=x===''?null:Number(x);
    out[f.k]=x});
   out.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
   const id=it?it.id:slug(editor.coll==='prices'?v.brandName+' '+(v.strength||''):v[sc.title]);
   await db.collection(editor.coll).doc(id).set(out,{merge:true});
   toast(it?'Saved changes':'Added');setEditor(null);
  }catch(x){setEr(x.message)}finally{setBusy(false)}};
 return(<div className="fixed inset-0 z-50 flex items-start justify-center overflow-y-auto p-4" style={{background:'rgba(0,0,0,.5)'}} onMouseDown={e=>e.target===e.currentTarget&&setEditor(null)}>
  <form onSubmit={save} className="card w-full max-w-2xl p-5 my-6 space-y-3" role="dialog" aria-modal="true">
   <h2 className="serif text-xl font-bold">{it?'Edit':'Add'} {sc.one}</h2>
   {er&&<div className="text-sm p-2 rounded" style={{background:'var(--rds)',color:'var(--rd)'}}>{er}</div>}
   {sc.fields.map(f=><label key={f.k} className="block text-sm font-semibold">{f.l}{f.req&&' *'}
    {f.t==='area'?<textarea className="inp mt-1 font-normal" rows={3} value={v[f.k]} onChange={e=>setV({...v,[f.k]:e.target.value})}/>
    :f.t==='bool'?<span className="flex items-center gap-2 mt-1 font-normal"><input type="checkbox" checked={!!v[f.k]} onChange={e=>setV({...v,[f.k]:e.target.checked})}/> {v[f.k]?'Published':'Draft (only admins can see it)'}</span>
    :f.t==='sel'?<select className="inp mt-1 font-normal" value={v[f.k]} onChange={e=>setV({...v,[f.k]:e.target.value})}>{f.o.map(o=><option key={o}>{o}</option>)}</select>
    :<input className="inp mt-1 font-normal" type={f.t==='num'?'number':'text'} step="any" required={!!f.req} value={v[f.k]} onChange={e=>setV({...v,[f.k]:e.target.value})}/>}</label>)}
   <div className="flex justify-end gap-2 pt-2"><button type="button" className="btn2" onClick={()=>setEditor(null)}>Cancel</button><button className="btn" disabled={busy}>{busy?'Saving…':'Save changes'}</button></div>
  </form></div>);
}

/* ============ ADMIN DASHBOARD ============ */
function Admin(c){
 const {data,setEditor,toast}=c;
 const [coll,setColl]=useState('drugs');const [f,setF]=useState('');const [json,setJson]=useState('');const [sel,setSel]=useState([]);
 const sc=SCHEMAS[coll];const toks=f.toLowerCase().split(/\s+/).filter(Boolean);
 const rows=data[coll].filter(x=>toks.every(t=>flat(x).includes(t))).sort((a,b)=>String(a[sc.title]||'').localeCompare(String(b[sc.title]||'')));
 const togglePub=async x=>{try{await db.collection(coll).doc(x.id).update({published:x.published===false})}catch(e){toast(e.message)}};
 const delMany=async()=>{if(!sel.length||!confirm('Delete '+sel.length+' selected records?'))return;
  try{const b=db.batch();sel.forEach(id=>b.delete(db.collection(coll).doc(id)));await b.commit();setSel([]);toast('Deleted '+sel.length)}catch(e){toast(e.message)}};
 const summ=(()=>{if(!json.trim())return null;try{let d=JSON.parse(json);if(Array.isArray(d))d={[coll]:d};
  const p=Object.keys(SCHEMAS).filter(k=>Array.isArray(d[k])).map(k=>d[k].length+' '+SCHEMAS[k].label.toLowerCase());
  return p.length?{ok:1,t:'Ready to import: '+p.join(', ')+'.'}:{t:'No drugs, conditions, prices or references found in this file.'}}catch(e){return{t:'This is not valid JSON: '+e.message}}})();
 const sample=()=>download('doc-nepal-sample.json',{drugs:[{genericName:'Paracetamol',brandNames:['Crocin','Dolo'],drugClass:'Analgesic / antipyretic',indications:'Mild to moderate pain; fever.',adultDose:'500 to 1000 mg every 4 to 6 hours. Max 4 g/day.',pediatricDose:'10 to 15 mg/kg every 4 to 6 hours.',adverseDrugReactions:'Rash; hepatotoxicity in overdose.',contraindications:'Severe hepatic impairment; hypersensitivity.',mechanismOfAction:'Central COX inhibition.',published:true}],prices:[{brandName:'Dolo 500',genericName:'Paracetamol',strength:'500 mg tablet',packSize:'10 tablets',manufacturer:'Example Pharma',priceNPR:25,verificationStatus:'Verified'}],conditions:[],references:[]});
 const bulk=async()=>{
  try{let d=JSON.parse(json);if(Array.isArray(d))d={[coll]:d};let n=0,skipped=0;let b=db.batch();
   for(const c2 of Object.keys(SCHEMAS)){if(!Array.isArray(d[c2]))continue;
    for(const r of d[c2]){const t=SCHEMAS[c2].title;const id=r.id||slug(c2==='prices'?(r.brandName+' '+(r.strength||'')):r[t]);const {id:_,...rest}=r;
     if(!r.id&&!r[t]){skipped++;continue}
     if(typeof rest.brandNames==='string')rest.brandNames=rest.brandNames.split(',').map(s=>s.trim()).filter(Boolean);
     if(typeof rest.priceNPR==='string')rest.priceNPR=Number(rest.priceNPR);
     if(c2==='drugs'){rest.published=rest.published??true;rest.drugClass=rest.drugClass??''}
     if(c2==='conditions')rest.published=rest.published??true;
     if(c2==='prices')rest.verificationStatus=rest.verificationStatus||'Verified';
     b.set(db.collection(c2).doc(id),{...rest,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});n++;
     if(n%400===0){await b.commit();b=db.batch()}}}
   await b.commit();toast('Imported '+n+' records'+(skipped?' ('+skipped+' skipped: no name)':''));setJson('')}catch(e){toast('Import failed: '+e.message)}};
 return(<div className="max-w-6xl mx-auto px-4 py-6 space-y-5">
  <div className="flex flex-wrap justify-between gap-2"><h1 className="serif text-2xl font-bold">Admin: manage records</h1>
   <button className="btn2" onClick={()=>download('doc-nepal-backup-'+new Date().toISOString().slice(0,10)+'.json',Object.fromEntries(Object.keys(SCHEMAS).map(k=>[k,data[k].map(({updatedAt,...r})=>r)])))}>Download backup (JSON)</button></div>
  <div className="flex flex-wrap gap-2">{Object.entries(SCHEMAS).map(([k,s])=><button key={k} className={'btn2 '+(coll===k?'on':'')} onClick={()=>{setColl(k);setSel([]);setF('')}}>{s.label} <span className="mu">{data[k].length}</span></button>)}</div>
  <div className="flex flex-wrap gap-2"><input className="inp flex-1" style={{minWidth:200}} placeholder={'Search '+sc.label.toLowerCase()+'…'} value={f} onChange={e=>setF(e.target.value)}/>
   <button className="btn" onClick={()=>setEditor({coll,item:null})}>+ Add {sc.one}</button>
   {sel.length>0&&<button className="btn2 dng" onClick={delMany}>Delete {sel.length} selected</button>}</div>
  {rows.length===0?<Empty>No {sc.label.toLowerCase()} found.</Empty>:
  <div className="card overflow-x-auto"><table className="w-full text-sm"><tbody>{rows.map(x=><tr key={x.id} className="border-t first:border-t-0" style={{borderColor:'var(--ln)'}}>
   <td className="p-3 w-8"><input type="checkbox" aria-label="Select" checked={sel.includes(x.id)} onChange={e=>setSel(e.target.checked?[...sel,x.id]:sel.filter(i=>i!==x.id))}/></td>
   <td className="p-3"><div className="font-bold">{x[sc.title]||x.id}</div><div className="mu line-clamp-1">{coll==='prices'?[x.genericName,x.strength,npr(x.priceNPR)].filter(Boolean).join(' · '):x[sc.sub]}</div></td>
   <td className="p-3 text-right whitespace-nowrap">
    {'published' in (sc.fields.find(f=>f.k==='published')?{published:1}:{})&&<button className={'tag mr-2 '+(x.published===false?'p':'')} onClick={()=>togglePub(x)} title="Click to toggle">{x.published===false?'Draft':'Published'}</button>}
    {coll==='prices'&&x.verificationStatus&&<span className="tag mr-2">{x.verificationStatus}</span>}
    <button className="btn2" onClick={()=>setEditor({coll,item:x})}>Edit</button></td></tr>)}</tbody></table></div>}
  <details className="card"><summary className="px-5 py-3 font-bold">Bulk import (JSON)</summary><div className="px-5 pb-5 space-y-2">
   <p className="text-sm mu">Upload a .json file or paste it below. Use {'{ "drugs": [...], "conditions": [...], "prices": [...], "references": [...] }'}, or a plain list, which goes into the tab you have open ({sc.label}). Records with the same id or name are updated, not duplicated.</p>
   <div className="flex flex-wrap gap-2 items-center">
    <label className="btn cursor-pointer">Choose JSON file<input type="file" accept=".json,application/json" className="sr-only" onChange={async e=>{const fl=e.target.files[0];if(fl){setJson(await fl.text());toast('Loaded '+fl.name)}e.target.value=''}}/></label>
    <button type="button" className="btn2" onClick={sample}>Download sample file</button></div>
   <textarea className="inp font-mono text-xs" rows={8} value={json} onChange={e=>setJson(e.target.value)} placeholder="Or paste JSON here"/>
   {summ&&<div className="text-sm p-2 rounded" style={summ.ok?{background:'var(--soft)',color:'var(--brd)'}:{background:'var(--rds)',color:'var(--rd)'}}>{summ.t}</div>}
   <button className="btn" onClick={bulk} disabled={!summ?.ok}>Import records</button></div></details>
 </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
