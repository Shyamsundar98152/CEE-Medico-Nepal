<script type="module">

    /* =========================================================
       FIREBASE IMPORTS
    ========================================================= */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";


    import {
        getAuth,
        createUserWithEmailAndPassword,
        GoogleAuthProvider,
        signInWithPopup,
        updateProfile,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";


    import {
        getFirestore,
        doc,
        setDoc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";


    import {
        getDatabase,
        ref,
        set,
        get,
        update,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-database.js";


    /* =========================================================
       FIREBASE CONFIG
    ========================================================= */

    const firebaseConfig = {

        apiKey: "AIzaSyB66MZa0WZk3WPydcjmCDu7P_CE0FD60ug",

        authDomain: "login-2f07b.firebaseapp.com",

        projectId: "login-2f07b",

        storageBucket: "login-2f07b.appspot.com",

        messagingSenderId: "709252763741",

        appId: "1:709252763741:web:b3902697cc9c8b157a7db4",

        measurementId: "G-G7ZY1MJ106",

        databaseURL:
            "https://login-2f07b-default-rtdb.asia-southeast1.firebasedatabase.app"

    };


    /* =========================================================
       INITIALIZE FIREBASE
    ========================================================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const rtdb = getDatabase(app);

    const provider = new GoogleAuthProvider();


    /* =========================================================
       COURSE REDIRECT SETTINGS
       
       CHANGE THESE 3 URLS TO YOUR ACTUAL PAGES
    ========================================================= */

    const COURSE_REDIRECTS = {

        cee:
            "/secure/cee.html",

        ioe:
            "/secure/ioe-premium.html",

        nmcle:
            "/secure/nmcle.html"

    };


    /* =========================================================
       COMMON ELEMENTS
    ========================================================= */

    const signupContainer =
        document.getElementById("signupContainer");

    const message =
        document.getElementById("message");


    /* =========================================================
       SHOW MESSAGE
    ========================================================= */

    function showMessage(text, type = "error") {

        message.textContent = text;

        if (type === "success") {

            message.style.color = "green";

        } else {

            message.style.color = "red";

        }

    }


    /* =========================================================
       LOADING BUTTON
    ========================================================= */

    function setLoading(buttonId, isLoading) {

        const button =
            document.getElementById(buttonId);

        const buttonText =
            document.getElementById(`${buttonId}Text`);


        if (isLoading) {

            button.disabled = true;

            if (buttonId === "googleBtn") {

                buttonText.innerHTML =
                    `<span class="loading google-loading"></span> Processing...`;

            } else {

                buttonText.innerHTML =
                    `<span class="loading"></span> Processing...`;

            }

        } else {

            button.disabled = false;

            if (buttonId === "signupBtn") {

                buttonText.textContent = "Sign Up";

            } else {

                buttonText.textContent =
                    "Sign in with Google";

            }

        }

    }


    /* =========================================================
       COURSE REDIRECT FUNCTION
    ========================================================= */

    function redirectByCourse(course) {

        if (!course) {

            console.warn("No course found.");

            window.location.replace(
                "/secure/select-course.html"
            );

            return;

        }


        // Normalize course value

        const normalizedCourse =
            String(course).trim().toLowerCase();


        const destination =
            COURSE_REDIRECTS[normalizedCourse];


        if (destination) {

            console.log(
                `Redirecting user to ${normalizedCourse}: ${destination}`
            );

            window.location.replace(destination);

        } else {

            console.warn(
                "Unknown course:",
                normalizedCourse
            );

            window.location.replace(
                "/secure/select-course.html"
            );

        }

    }


    /* =========================================================
       SAVE USER TO FIRESTORE
    ========================================================= */

    async function saveUserToFirestore(
        user,
        course,
        extraData = {}
    ) {

        const userRef =
            doc(db, "users", user.uid);


        const data = {

            uid: user.uid,

            name:
                user.displayName ||
                extraData.name ||
                "User",

            email:
                user.email ||
                "",

            course: course,

            lastLogin: new Date(),

            ...extraData

        };


        await setDoc(
            userRef,
            data,
            {
                merge: true
            }
        );


        console.log(
            "Firestore user saved:",
            user.uid,
            course
        );

    }


    /* =========================================================
       SAVE USER TO REALTIME DATABASE
    ========================================================= */

    async function saveUserToRealtimeDatabase(
        user,
        course,
        isNewUser = false
    ) {

        const userRef =
            ref(
                rtdb,
                "users/" + user.uid
            );


        const snapshot =
            await get(userRef);


        if (!snapshot.exists()) {

            await set(
                userRef,
                {

                    uid: user.uid,

                    email:
                        user.email || "",

                    name:
                        user.displayName ||
                        "User",

                    course: course,

                    isApproved: false,

                    createdAt:
                        serverTimestamp()

                }
            );

        } else {

            const updateData = {

                course: course,

                email:
                    user.email || "",

                name:
                    user.displayName ||
                    "User",

                lastLogin:
                    serverTimestamp()

            };


            // Don't reset approval status

            await update(
                userRef,
                updateData
            );

        }


        console.log(
            "Realtime Database user saved:",
            user.uid,
            course
        );

    }


    /* =========================================================
       GET USER COURSE
       
       Firestore is the primary source.
       RTDB is used as fallback.
    ========================================================= */

    async function getUserCourse(user) {

        /* -----------------------------------------
           FIRST: FIRESTORE
        ----------------------------------------- */

        try {

            const firestoreRef =
                doc(db, "users", user.uid);

            const firestoreSnapshot =
                await getDoc(firestoreRef);


            if (
                firestoreSnapshot.exists()
            ) {

                const data =
                    firestoreSnapshot.data();


                if (data.course) {

                    console.log(
                        "Course found in Firestore:",
                        data.course
                    );

                    return data.course;

                }

            }

        } catch (error) {

            console.error(
                "Firestore course read error:",
                error
            );

        }


        /* -----------------------------------------
           SECOND: REALTIME DATABASE FALLBACK
        ----------------------------------------- */

        try {

            const rtdbRef =
                ref(
                    rtdb,
                    "users/" + user.uid
                );

            const rtdbSnapshot =
                await get(rtdbRef);


            if (rtdbSnapshot.exists()) {

                const data =
                    rtdbSnapshot.val();


                if (data.course) {

                    console.log(
                        "Course found in RTDB:",
                        data.course
                    );

                    return data.course;

                }

            }

        } catch (error) {

            console.error(
                "Realtime Database course read error:",
                error
            );

        }


        return null;

    }


    /* =========================================================
       ALREADY LOGGED-IN USER
       
       THIS IS THE IMPORTANT PART.
       
       If a user is already authenticated and opens
       signup.html, they are NOT shown the signup form.
       
       Their course is loaded and they are redirected.
    ========================================================= */

    let authCheckComplete = false;


    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                authCheckComplete = true;

                console.log(
                    "No logged-in user. Showing signup page."
                );

                return;

            }


            console.log(
                "Already logged-in user:",
                user.uid
            );


            // Hide signup form while checking

            signupContainer.innerHTML = `

                <div class="checking-login">

                    Checking your account...

                </div>

            `;


            try {

                const course =
                    await getUserCourse(user);


                if (course) {

                    /*
                     * Synchronize the course back into
                     * Firebase user details.
                     */

                    await saveUserToFirestore(
                        user,
                        course
                    );


                    await saveUserToRealtimeDatabase(
                        user,
                        course
                    );


                    console.log(
                        "Existing user course synchronized:",
                        course
                    );


                    /*
                     * Direct course redirect
                     */

                    redirectByCourse(course);


                    return;

                }


                /*
                 * User exists but course is missing.
                 */

                console.log(
                    "Logged-in user has no course."
                );


                window.location.replace(
                    "/secure/select-course.html"
                );


            } catch (error) {

                console.error(
                    "Existing user redirect error:",
                    error
                );


                signupContainer.innerHTML = `

                    <h2>Account Error</h2>

                    <div class="message"
                         style="color:red">

                        Unable to load your account details.

                        <br><br>

                        Please try again.

                    </div>

                    <br>

                    <button
                        class="btn-primary"
                        onclick="location.reload()">

                        Try Again

                    </button>

                `;

            }

        }
    );


    /* =========================================================
       EMAIL / PASSWORD SIGNUP
    ========================================================= */

    window.signup = async function () {

        const name =
            document
                .getElementById("signupName")
                .value
                .trim();


        const course =
            document
                .getElementById("signupCourse")
                .value;


        const email =
            document
                .getElementById("signupEmail")
                .value
                .trim();


        const password =
            document
                .getElementById("signupPassword")
                .value;


        const confirmPassword =
            document
                .getElementById("signupConfirmPassword")
                .value;


        /* -----------------------------------------
           VALIDATION
        ----------------------------------------- */

        if (
            !name ||
            !course ||
            !email ||
            !password ||
            !confirmPassword
        ) {

            showMessage(
                "Please fill in all fields including course selection."
            );

            return;

        }


        if (
            password !== confirmPassword
        ) {

            showMessage(
                "Passwords don't match."
            );

            return;

        }


        if (
            password.length < 6
        ) {

            showMessage(
                "Password must be at least 6 characters."
            );

            return;

        }


        setLoading(
            "signupBtn",
            true
        );


        showMessage(
            "",
            "success"
        );


        try {

            /* -----------------------------------------
               CREATE AUTH USER
            ----------------------------------------- */

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            /* -----------------------------------------
               UPDATE DISPLAY NAME
            ----------------------------------------- */

            await updateProfile(
                user,
                {
                    displayName: name
                }
            );


            /*
             * Firebase Auth user now has:
             *
             * uid
             * email
             * displayName
             */


            /* -----------------------------------------
               SAVE TO FIRESTORE
            ----------------------------------------- */

            await saveUserToFirestore(
                user,
                course,
                {
                    name: name,
                    provider: "password",
                    createdAt: new Date()
                }
            );


            /* -----------------------------------------
               SAVE TO REALTIME DATABASE
            ----------------------------------------- */

            await saveUserToRealtimeDatabase(
                user,
                course,
                true
            );


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            showMessage(
                `Account created for ${course.toUpperCase()}! Redirecting...`,
                "success"
            );


            /*
             * Redirect according to selected course.
             */

            setTimeout(
                () => {

                    redirectByCourse(
                        course
                    );

                },
                800
            );


        } catch (error) {

            console.error(
                "Signup error:",
                error
            );


            let errorMessage =
                "Signup failed.";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                errorMessage =
                    "This email is already registered. Please log in.";

            } else if (
                error.code ===
                "auth/invalid-email"
            ) {

                errorMessage =
                    "Invalid email format.";

            } else if (
                error.code ===
                "auth/weak-password"
            ) {

                errorMessage =
                    "Password should be at least 6 characters.";

            } else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                errorMessage =
                    "Network error. Please check your internet connection.";

            } else {

                errorMessage =
                    error.message ||
                    "Signup failed.";

            }


            showMessage(
                errorMessage
            );

        } finally {

            setLoading(
                "signupBtn",
                false
            );

        }

    };


    /* =========================================================
       GOOGLE SIGN IN
    ========================================================= */

    window.signInWithGoogle = async function () {

        const courseSelect =
            document.getElementById(
                "signupCourse"
            );


        const selectedCourse =
            courseSelect.value;


        /*
         * Course is required for a completely new
         * Google account.
         *
         * Existing Google users can use their
         * previously stored course.
         */

        setLoading(
            "googleBtn",
            true
        );


        showMessage(
            ""
        );


        try {

            /* -----------------------------------------
               GOOGLE POPUP
            ----------------------------------------- */

            const result =
                await signInWithPopup(
                    auth,
                    provider
                );


            const user =
                result.user;


            console.log(
                "Google authenticated:",
                user.uid
            );


            /* -----------------------------------------
               CHECK EXISTING COURSE
            ----------------------------------------- */

            let existingCourse =
                await getUserCourse(user);


            let course =
                existingCourse ||
                selectedCourse;


            /*
             * If this is a completely new user,
             * require course selection.
             */

            if (!course) {

                showMessage(
                    "Please select your target course."
                );


                /*
                 * The Google account is already
                 * authenticated at this point.
                 *
                 * Send user to course selection.
                 */

                window.location.replace(
                    "/secure/select-course.html"
                );

                return;

            }


            /* -----------------------------------------
               SAVE TO FIRESTORE
            ----------------------------------------- */

            await saveUserToFirestore(
                user,
                course,
                {
                    provider: "google"
                }
            );


            /* -----------------------------------------
               SAVE TO REALTIME DATABASE
            ----------------------------------------- */

            await saveUserToRealtimeDatabase(
                user,
                course
            );


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            showMessage(
                `Authentication successful for ${course.toUpperCase()}! Redirecting...`,
                "success"
            );


            setTimeout(
                () => {

                    redirectByCourse(
                        course
                    );

                },
                800
            );


        } catch (error) {

            console.error(
                "Google sign-in error:",
                error
            );


            /*
             * User closed the popup.
             */

            if (
                error.code ===
                "auth/popup-closed-by-user"
            ) {

                showMessage(
                    "Google sign-in was cancelled."
                );

            } else if (
                error.code ===
                "auth/popup-blocked"
            ) {

                showMessage(
                    "Popup was blocked by your browser. Please allow popups and try again."
                );

            } else {

                showMessage(
                    error.message ||
                    "Google Sign-In failed."
                );

            }

        } finally {

            setLoading(
                "googleBtn",
                false
            );

        }

    };


    /* =========================================================
       ENTER KEY SUPPORT
    ========================================================= */

    document.addEventListener(
        "keypress",
        function(e) {

            if (
                e.key !== "Enter"
            ) {

                return;

            }


            const activeElementId =
                document.activeElement.id;


            if (

                activeElementId ===
                    "signupEmail"

                ||

                activeElementId ===
                    "signupPassword"

                ||

                activeElementId ===
                    "signupConfirmPassword"

                ||

                activeElementId ===
                    "signupName"

            ) {

                window.signup();

            }

        }
    );


    /* =========================================================
       MOBILE MENU
    ========================================================= */

    const hamburgerMenu =
        document.getElementById(
            "hamburgerMenu"
        );


    const navMenu =
        document.getElementById(
            "navMenu"
        );


    hamburgerMenu.addEventListener(
        "click",
        () => {

            hamburgerMenu.classList.toggle(
                "active"
            );

            navMenu.classList.toggle(
                "active"
            );

        }
    );


    navMenu
        .querySelectorAll("a")
        .forEach(
            link => {

                link.addEventListener(
                    "click",
                    () => {

                        hamburgerMenu.classList.remove(
                            "active"
                        );

                        navMenu.classList.remove(
                            "active"
                        );

                    }
                );

            }
        );

</script>

</body>
</html>
